version: "3.9"

services:

  hyrcania-app:

    build: .

    container_name: hyrcania-app

    ports:
      - "${APP_PORT}:5000"


    environment:

      APP_NAME: ${APP_NAME}

      APP_ENV: ${APP_ENV}

      DATABASE_HOST: ${DATABASE_HOST}

      DATABASE_PORT: ${DATABASE_PORT}

      DATABASE_NAME: ${DATABASE_NAME}

      DATABASE_USER: ${DATABASE_USER}

      DATABASE_PASSWORD: ${DATABASE_PASSWORD}


    depends_on:

      hyrcania-db:

        condition: service_healthy


    restart: unless-stopped


    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]

      interval: 30s

      timeout: 10s

      retries: 3


    networks:

      - hyrcania-network



  hyrcania-db:

    image: postgres:16

    container_name: hyrcania-db


    environment:

      POSTGRES_DB: ${DATABASE_NAME}

      POSTGRES_USER: ${DATABASE_USER}

      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}


    volumes:

      - postgres-data:/var/lib/postgresql/data


    restart: unless-stopped


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - hyrcania-network



volumes:

  postgres-data:



networks:

  hyrcania-network:

    driver: bridge