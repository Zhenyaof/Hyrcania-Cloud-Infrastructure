version: "3.9"

services:

  hyrcania-app:
    build: .
    container_name: hyrcania-app

    ports:
      - "8080:5000"

    environment:
      APP_NAME: Hyrcania
      APP_ENV: production
      DATABASE_HOST: hyrcania-db
      DATABASE_PORT: 5432
      DATABASE_NAME: hyrcania
      DATABASE_USER: admin
      DATABASE_PASSWORD: password

    depends_on:
      hyrcania-db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - hyrcania-network


  hyrcania-db:
    image: postgres:16

    container_name: hyrcania-db

    environment:
      POSTGRES_DB: hyrcania
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d hyrcania"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - hyrcania-network



volumes:

  postgres-data:


networks:

  hyrcania-network:
    driver: bridge