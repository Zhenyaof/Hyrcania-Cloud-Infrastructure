version: "3.9"

services:

  hyrcania-app:
    build: .
    container_name: hyrcania-app

    ports:
      - "8080:5000"

    environment:
      APP_ENV: production
      APP_NAME: Hyrcania

    restart: unless-stopped

    volumes:
      - app-data:/app/data

    networks:
      - hyrcania-network

volumes:
  app-data:

networks:
  hyrcania-network:
    driver: bridge